<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="system-ui,Segoe UI,sans-serif">
  <title>Los primeros 10 pines de la tira GPIO de la Raspberry Pi 5</title>
  <rect width="720" height="520" rx="18" fill="#ffffff" stroke="#d0d4dc"/>
  <text x="360" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1b1f2a">Los pines que vas a usar (vista desde arriba)</text>
  <text x="360" y="62" text-anchor="middle" font-size="14" fill="#5b6475">La tira está junto a un borde de la placa. El pin 1 es el del extremo con el pad CUADRADO.</text>
  <!-- cuerpo de la tira -->
  <rect x="250" y="84" width="150" height="402" rx="10" fill="#222831"/>
  <!-- filas -->
  <g font-size="15" fill="#1b1f2a">
    <!-- impares (izquierda) -->
    <rect x="272" y="98"  width="30" height="30" fill="#e5484d"/><text x="287" y="119" text-anchor="middle" fill="#fff" font-weight="700">1</text>
    <circle cx="287" cy="176" r="15" fill="#2f9e5b"/><text x="287" y="181" text-anchor="middle" fill="#fff" font-weight="700">3</text>
    <circle cx="287" cy="236" r="15" fill="#d99a00"/><text x="287" y="241" text-anchor="middle" fill="#fff" font-weight="700">5</text>
    <circle cx="287" cy="296" r="15" fill="#555d6b"/><text x="287" y="301" text-anchor="middle" fill="#fff" font-weight="700">7</text>
    <circle cx="287" cy="356" r="15" fill="#111"/><text x="287" y="361" text-anchor="middle" fill="#fff" font-weight="700">9</text>
    <circle cx="287" cy="416" r="15" fill="#555d6b"/><text x="287" y="421" text-anchor="middle" fill="#fff" font-weight="700">11</text>
    <!-- pares (derecha) -->
    <circle cx="363" cy="113" r="15" fill="#8a3b3b"/><text x="363" y="118" text-anchor="middle" fill="#fff">2</text>
    <circle cx="363" cy="176" r="15" fill="#8a3b3b"/><text x="363" y="181" text-anchor="middle" fill="#fff">4</text>
    <circle cx="363" cy="236" r="15" fill="#555d6b"/><text x="363" y="241" text-anchor="middle" fill="#fff">6</text>
    <circle cx="363" cy="296" r="15" fill="#555d6b"/><text x="363" y="301" text-anchor="middle" fill="#fff">8</text>
    <circle cx="363" cy="356" r="15" fill="#555d6b"/><text x="363" y="361" text-anchor="middle" fill="#fff">10</text>
    <circle cx="363" cy="416" r="15" fill="#555d6b"/><text x="363" y="421" text-anchor="middle" fill="#fff">12</text>
  </g>
  <!-- etiquetas izquierda: lo que SÍ se usa -->
  <g font-size="16" fill="#1b1f2a">
    <text x="232" y="112" text-anchor="end" font-weight="700">VCC (3,3 V)</text><text x="232" y="131" text-anchor="end" font-size="13" fill="#5b6475">cable rojo</text>
    <text x="232" y="172" text-anchor="end" font-weight="700">SDA</text><text x="232" y="191" text-anchor="end" font-size="13" fill="#5b6475">cable verde</text>
    <text x="232" y="232" text-anchor="end" font-weight="700">SCL</text><text x="232" y="251" text-anchor="end" font-size="13" fill="#5b6475">cable amarillo</text>
    <text x="232" y="292" text-anchor="end" fill="#8a93a3">(no se usa)</text>
    <text x="232" y="352" text-anchor="end" font-weight="700">GND (tierra)</text><text x="232" y="371" text-anchor="end" font-size="13" fill="#5b6475">cable negro</text>
  </g>
  <!-- etiquetas derecha: peligro -->
  <g font-size="14" fill="#b42318">
    <text x="414" y="118" font-weight="700">5 V: ¡NO CONECTAR!</text>
    <text x="414" y="181" font-weight="700">5 V: ¡NO CONECTAR!</text>
  </g>
  <text x="414" y="241" font-size="13" fill="#8a93a3">(no se usa)</text>
  <!-- guías -->
  <text x="287" y="78" text-anchor="middle" font-size="12" fill="#5b6475">impares</text>
  <text x="363" y="78" text-anchor="middle" font-size="12" fill="#5b6475">pares</text>
  <text x="414" y="302" font-size="13" fill="#5b6475">Usas solo la fila de los IMPARES</text><text x="414" y="321" font-size="13" fill="#5b6475">(1 · 3 · 5 · 9): así no tocas los 5 V.</text>
  <text x="360" y="508" text-anchor="middle" font-size="13" fill="#5b6475">Los colores de los cables son solo un ejemplo: da igual de qué color sean los TUYOS, lo que importa es el pin.</text>
</svg>
