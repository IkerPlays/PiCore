<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="system-ui,Segoe UI,sans-serif">
  <title>Cableado de la mini pantalla OLED a la Raspberry Pi</title>
  <rect width="760" height="420" rx="18" fill="#ffffff" stroke="#d0d4dc"/>
  <text x="380" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1b1f2a">Qué cable va a qué pin</text>
  <rect x="40" y="70" width="170" height="250" rx="12" fill="#141922"/>
  <text x="70" y="352" font-size="13" fill="#5b6475">Pantalla OLED (4 pines)</text>
  <text x="545" y="352" text-anchor="middle" font-size="13" fill="#5b6475">Pi (pines 1 a 9)</text>
  <rect x="516" y="70" width="110" height="250" rx="10" fill="#222831"/>
  <g><rect x="176" y="98" width="24" height="24" fill="#c9a227"/><text x="164" y="115" text-anchor="end" font-size="15" font-weight="700" fill="#fff">GND</text><rect x="176" y="148" width="24" height="24" fill="#c9a227"/><text x="164" y="165" text-anchor="end" font-size="15" font-weight="700" fill="#fff">VCC</text><rect x="176" y="198" width="24" height="24" fill="#c9a227"/><text x="164" y="215" text-anchor="end" font-size="15" font-weight="700" fill="#fff">SCL</text><rect x="176" y="248" width="24" height="24" fill="#c9a227"/><text x="164" y="265" text-anchor="end" font-size="15" font-weight="700" fill="#fff">SDA</text></g>
  <g><rect x="532" y="88" width="26" height="26" fill="#e5484d"/><text x="545" y="106" text-anchor="middle" font-weight="700" fill="#fff">1</text><circle cx="545" cy="150" r="13" fill="#2f9e5b"/><text x="545" y="155" text-anchor="middle" fill="#fff" font-weight="700">3</text><circle cx="545" cy="200" r="13" fill="#d99a00"/><text x="545" y="205" text-anchor="middle" fill="#fff" font-weight="700">5</text><circle cx="545" cy="250" r="13" fill="#555d6b"/><text x="545" y="255" text-anchor="middle" fill="#fff">7</text><circle cx="545" cy="300" r="13" fill="#111"/><text x="545" y="305" text-anchor="middle" fill="#fff" font-weight="700">9</text><circle cx="595" cy="101" r="13" fill="#8a3b3b"/><text x="595" y="106" text-anchor="middle" fill="#fff">2</text><circle cx="595" cy="150" r="13" fill="#8a3b3b"/><text x="595" y="155" text-anchor="middle" fill="#fff">4</text></g>
  <g fill="none" stroke-width="5" stroke-linecap="round"><path d="M200 110 C 360 110, 370 300, 530 300" stroke="#111"/><path d="M200 160 C 360 160, 370 100, 530 100" stroke="#e5484d"/><path d="M200 210 C 360 210, 370 200, 530 200" stroke="#d99a00"/><path d="M200 260 C 360 260, 370 150, 530 150" stroke="#2f9e5b"/></g>
  <g><text x="506" y="90" text-anchor="end" font-size="14" font-weight="700" fill="#1b1f2a">VCC → pin 1</text><text x="506" y="140" text-anchor="end" font-size="14" font-weight="700" fill="#1b1f2a">SDA → pin 3</text><text x="506" y="190" text-anchor="end" font-size="14" font-weight="700" fill="#1b1f2a">SCL → pin 5</text><text x="506" y="290" text-anchor="end" font-size="14" font-weight="700" fill="#1b1f2a">GND → pin 9</text></g>
  <text x="595" y="337" text-anchor="middle" font-size="12" fill="#b42318">pines 2 y 4 = 5 V: no tocar</text>
  <text x="380" y="396" text-anchor="middle" font-size="13" fill="#5b6475">El orden de los pines de la OLED puede ser otro: sigue SIEMPRE el nombre (GND, VCC, SCL, SDA), no la posición.</text>
</svg>
