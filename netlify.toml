# Despliegue de la DEMO WEB de PiCore en Netlify (la interfaz con una API simulada en JavaScript; no necesita servidor).
# Conectar el repositorio en Netlify: Add new site -> Import an existing project -> GitHub -> este repositorio.
# Netlify lee este archivo y no hay nada mas que configurar. Para probarlo en local:  make demo
[build]
  command = "python3 tools/build_web_demo.py"
  publish = "dist-demo"

# La portada (/) es la carcasa del dispositivo; Casa esta en /app. Las "rutas" de la Pi (/iker, /dev, /loading) son paginas estaticas.
[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/iker"
  to = "/iker.html"
  status = 200
[[redirects]]
  from = "/dev"
  to = "/dev.html"
  status = 200
[[redirects]]
  from = "/loading"
  to = "/loading.html"
  status = 200
