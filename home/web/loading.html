<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PiCore · Cargando</title>
<style>
  :root { --bg:#0b0d12; --card:#161a22; --fg:#f2f4f8; --dim:#8b93a3; --line:#262c38; --acc:#7aa7ff; --acc2:#b18cff; }
  * { box-sizing:border-box; margin:0; }
  [hidden] { display:none !important; }   /* sin esto, #intro (display:flex) taparia los botones aunque estuviera oculto */
  html,body { height:100%; overflow:hidden; cursor:none; user-select:none; -webkit-user-select:none;
              font-family:system-ui,"Segoe UI",sans-serif; background:#fff; color:var(--fg); }

  /* ---------- 1. Pantalla de Inicio: blanco + video ---------- */
  #intro { position:fixed; inset:0; background:#fff; display:flex; align-items:center; justify-content:center; z-index:30;
           transition:opacity .7s ease; }
  #intro video { max-width:100%; max-height:100%; width:100%; height:100%; object-fit:contain; background:#fff; }
  #intro.out { opacity:0; pointer-events:none; }
  /* pantalla de descarga del intro 4 (primer encendido): tarjeta clara sobre el blanco */
  #dl { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:#fff; z-index:3; }
  .dl-card { width:min(460px,90vw); text-align:center; color:#222; }
  .dl-title { font-size:24px; font-weight:650; } .dl-sub { color:#777; font-size:15px; margin-top:6px; min-height:20px; }
  .dl-bar { height:12px; border-radius:999px; background:#e7e9ee; overflow:hidden; margin-top:22px; }
  #dl-fill { height:100%; width:0; border-radius:999px; background:linear-gradient(90deg,#7aa7ff,#b18cff); transition:width .4s ease; }
  #dl-fill.ind { width:35% !important; animation:ind 1.3s ease-in-out infinite alternate; }
  @keyframes ind { from { margin-left:0 } to { margin-left:65% } }
  .dl-row { display:flex; justify-content:space-between; margin-top:10px; font-size:15px; font-variant-numeric:tabular-nums; color:#444; }
  #dl-skip { margin-top:22px; font:inherit; font-size:13px; padding:6px 14px; border-radius:999px; color:#222; background:#f3f4f7; border:1px solid #0002; }
  #dl-skip:active { background:#222; color:#fff; }
  /* boton pequeño en la esquina inferior derecha del Inicio (solo en los videos que lo piden, p. ej. el 4.º) */
  #intro-skip { position:absolute; right:14px; bottom:12px; z-index:2; font:inherit; font-size:12px; padding:5px 11px; border-radius:999px; color:#222; background:#ffffffd9;
                border:1px solid #00000033; opacity:0; transition:opacity .4s ease; }
  #intro-skip.on { opacity:1; }
  #intro-skip:active { background:#222; color:#fff; }

  /* ---------- 2. Pantalla de Carga ---------- */
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:18px;
           background:radial-gradient(120% 90% at 50% 0%, #1b2233 0%, var(--bg) 62%); opacity:0; transition:opacity .6s ease; }
  #stage.on { opacity:1; }
  #stage::before, #stage::after { content:""; position:absolute; width:60vmax; height:60vmax; border-radius:50%; filter:blur(70px); opacity:.16; pointer-events:none; }
  #stage::before { background:var(--acc); top:-30vmax; left:-20vmax; animation:drift 14s ease-in-out infinite alternate; }
  #stage::after  { background:var(--acc2); bottom:-34vmax; right:-24vmax; animation:drift 17s ease-in-out infinite alternate-reverse; }
  @keyframes drift { to { transform:translate(8vmax,5vmax) scale(1.12); } }

  .popup { position:relative; width:min(560px,94vw); background:var(--card); border:1px solid var(--line); border-radius:26px;
           padding:28px 30px 24px; box-shadow:0 30px 80px #0009; transform:translateY(16px) scale(.97); opacity:0;
           transition:transform .7s cubic-bezier(.2,.9,.25,1), opacity .6s ease; z-index:2; }
  #stage.on .popup { transform:none; opacity:1; }
  .title { font-size:26px; font-weight:650; letter-spacing:.01em; display:flex; align-items:baseline; gap:2px; }
  .dots span { animation:dot 1.2s infinite; opacity:.2; }
  .dots span:nth-child(2) { animation-delay:.2s; } .dots span:nth-child(3) { animation-delay:.4s; }
  @keyframes dot { 0%,80%,100% { opacity:.2 } 40% { opacity:1 } }
  .sub { color:var(--dim); font-size:15px; margin-top:4px; }
  .barrow { display:flex; align-items:center; gap:16px; margin-top:20px; }
  .bar { position:relative; flex:1; height:14px; border-radius:999px; background:var(--line); overflow:hidden; }
  #fill { position:absolute; inset:0 auto 0 0; width:0; border-radius:999px; background:linear-gradient(90deg,var(--acc),var(--acc2)); }
  #fill::after { content:""; position:absolute; inset:0; background:linear-gradient(100deg,transparent 30%,#fff6 50%,transparent 70%);
                 transform:translateX(-100%); animation:shine 1.8s infinite; }
  @keyframes shine { to { transform:translateX(100%); } }
  #pct { font-size:30px; font-weight:700; min-width:3.4ch; text-align:right; font-variant-numeric:tabular-nums; }

  .media { position:relative; height:132px; margin-top:20px; border-radius:16px; background:#0e1118; overflow:hidden; display:none; }
  .media.has { display:block; }
  .media .slide { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; opacity:0; transform:scale(1.04);
                  transition:opacity .6s ease, transform 1.2s ease; }
  .media .slide.on { opacity:1; transform:none; }
  .media img, .media video { max-width:100%; max-height:100%; object-fit:contain; border-radius:10px; }
  .media .count { position:absolute; right:10px; bottom:8px; font-size:12px; color:#fffa; background:#0008; padding:2px 8px; border-radius:999px; }

  #skip { position:absolute; right:16px; bottom:14px; font:inherit; font-size:13px; padding:7px 14px; border-radius:999px; color:var(--fg);
          background:#ffffff14; border:1px solid #ffffff30; opacity:0; pointer-events:none; transform:translateY(6px); transition:all .35s ease; z-index:12; }
  #skip.on { opacity:1; pointer-events:auto; transform:none; }
  #skip:active { background:var(--acc); color:#07101f; }

  /* ---------- 3. Efecto TV / VCR "x2 >>" ---------- */
  #tv { position:fixed; inset:0; pointer-events:none; opacity:0; transition:opacity .35s ease; z-index:10; mix-blend-mode:screen; }
  #tv.on { opacity:1; }
  #tv .scan { position:absolute; inset:0; background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 2px,transparent 2px 4px); animation:flicker .18s steps(2) infinite; }
  #tv .roll { position:absolute; left:0; right:0; height:22%; background:linear-gradient(180deg,transparent,rgba(255,255,255,.13),transparent); animation:roll 2.2s linear infinite; }
  #tv .noise { position:absolute; inset:-20%; opacity:.16; animation:noise .25s steps(3) infinite;
               background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  #tv .osd { position:absolute; left:34px; top:28px; font:700 clamp(34px,6vw,64px)/1 "Courier New",ui-monospace,monospace; color:#e8ffe8; letter-spacing:.04em;
             text-shadow:3px 0 #ff2d55aa,-3px 0 #00e5ffaa,0 0 18px #7dff9a; animation:osd 1s steps(2) infinite; }
  #tv .osd small { display:block; font-size:.34em; margin-top:8px; letter-spacing:.2em; opacity:.85; }
  #tv .arrows i { display:inline-block; font-style:normal; animation:arrow .9s infinite; opacity:.25; }
  #tv .arrows i:nth-child(2) { animation-delay:.15s; } #tv .arrows i:nth-child(3) { animation-delay:.3s; }
  @keyframes flicker { 50% { opacity:.78 } }
  @keyframes roll { from { top:-30% } to { top:110% } }
  @keyframes noise { 0% { transform:translate(0,0) } 33% { transform:translate(-3%,2%) } 66% { transform:translate(2%,-3%) } 100% { transform:translate(0,0) } }
  @keyframes osd { 50% { opacity:.88 } }
  @keyframes arrow { 0%,100% { opacity:.25; transform:translateX(0) } 50% { opacity:1; transform:translateX(6px) } }
  body.fast .popup { animation:jitter .22s steps(2) infinite; }
  body.fast #fill { background:linear-gradient(90deg,#7dff9a,var(--acc)); }
  @keyframes jitter { 0% { transform:translate(0,0) } 50% { transform:translate(1.5px,-.6px) skewX(-.4deg) } 100% { transform:translate(-1.2px,.4px) } }

  @media (prefers-reduced-motion: reduce) {
    #stage::before,#stage::after,#fill::after,#tv .scan,#tv .noise,#tv .roll,body.fast .popup,#tv .osd { animation:none; }
  }
</style>
</head>
<body>

<div id="intro" hidden>
  <div id="dl" hidden>
    <div class="dl-card">
      <div class="dl-title">Descargando contenido extra</div>
      <div class="dl-sub" id="dl-sub">Solo la primera vez · necesita internet</div>
      <div class="dl-bar"><div id="dl-fill"></div></div>
      <div class="dl-row"><span id="dl-pct">0%</span><span id="dl-bytes"></span></div>
      <button id="dl-skip">Continuar sin esperar</button>
    </div>
  </div>
  <video id="intro-video" playsinline preload="auto"></video><button id="intro-skip" hidden>Saltar ⏭</button></div>

<div id="stage">
  <div class="popup">
    <div class="title"><span id="title">Cargando</span><span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
    <div class="sub" id="sub">Preparando PiCore</div>
    <div class="barrow">
      <div class="bar"><div id="fill"></div></div>
      <div id="pct">0%</div>
    </div>
    <div class="media" id="media"><span class="count" id="count"></span></div>
  </div>
  <button id="skip" hidden>Saltar ⏭</button>
</div>

<div id="tv" aria-hidden="true">
  <div class="noise"></div><div class="scan"></div><div class="roll"></div>
  <div class="osd"><span class="arrows"><i>▶</i><i>▶</i><i>▶</i></span> x2<small>FF</small></div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const q = new URLSearchParams(location.search);
const TO = ["home", "iker", "desktop"].includes(q.get("to")) ? q.get("to") : "home";
const IS_BOOT = q.get("boot") === "1";
const TARGET = {home: "/", iker: "/iker", desktop: null}[TO];     // lo que se precarga
const NAVIGATE = TO === "home";            // Casa continua en esta misma ventana; Iker/Escritorio los abre el vigilante
const NAMES = {home: "Casa", iker: "Iker", desktop: "Escritorio"};
const wait = ms => new Promise(r => setTimeout(r, ms));
const post = (url, body) => fetch(url, {method: "POST", headers: {"X-PCPI": "1"}, body: JSON.stringify(body || {})}).catch(() => {});

let cfg = {download: null, intro: null, intro_skip_after: 0, media: [], fake: true, fake_seconds: 6, min_seconds: 3, skip_button: true, media_seconds: 3};

/* ---------------- 0. Descarga del intro 4 (solo la primera vez) ---------------- */
const mb = n => (n / 1048576).toFixed(n >= 1e8 ? 0 : 1) + " MB";
async function downloadScreen() {
  const box = $("intro"), dl = $("dl");
  box.hidden = false; dl.hidden = false;
  let skipped = false;
  $("dl-skip").onclick = () => { skipped = true; };
  while (!skipped) {
    let st = null;
    try { st = await (await fetch("/api/download")).json(); } catch (e) {}
    if (st) {
      if (st.percent == null) $("dl-fill").classList.add("ind"); else { $("dl-fill").classList.remove("ind"); $("dl-fill").style.width = st.percent + "%"; }
      $("dl-pct").textContent = st.percent == null ? "…" : Math.floor(st.percent) + "%";
      $("dl-bytes").textContent = st.total ? mb(st.bytes) + " de " + mb(st.total) : (st.bytes ? mb(st.bytes) : "");
      if (st.state === "error") { $("dl-sub").textContent = st.error + " · se reintentará al próximo encendido"; await wait(2500); break; }
      if (st.state === "done") { $("dl-fill").style.width = "100%"; $("dl-pct").textContent = "100%"; await wait(400); break; }
    }
    await wait(500);
  }
  dl.hidden = true;
  box.hidden = true;
  return skipped;
}

/* ---------------- 1. Inicio ---------------- */
async function playIntro() {
  if (!IS_BOOT || !cfg.intro) return;
  const box = $("intro"), v = $("intro-video");
  box.hidden = false;
  await new Promise(done => {
    let finished = false, lastT = -1, stuck = 0;
    const end = () => { if (!finished) { finished = true; clearInterval(watch); done(); } };
    v.addEventListener("ended", end);
    v.addEventListener("error", end);
    /* boton «Saltar»: aparece cuando el VIDEO llega a `intro_skip_after` segundos (reproduccion real, no reloj de pared) */
    const sb = $("intro-skip");
    sb.onclick = end;
    if (cfg.intro_skip_after > 0) {
      (function check() {
        if (finished) return;
        if (v.currentTime >= cfg.intro_skip_after) { sb.hidden = false; requestAnimationFrame(() => sb.classList.add("on")); return; }
        requestAnimationFrame(check);
      })();
    }
    /* Vigilante: si el video no arranca o se queda parado (formato no soportado), no bloquea el arranque */
    const watch = setInterval(() => {
      const t = v.currentTime;
      stuck = t === lastT ? stuck + 1 : 0;
      lastT = t;
      if (stuck >= 20) end();                       // ~5 s sin avanzar
    }, 250);
    v.src = cfg.intro;
    v.play().catch(() => { v.muted = true; v.play().catch(end); });   // sin permiso de sonido: se reproduce mudo
  });
  box.classList.add("out");
  await wait(700);
  box.hidden = true;
}

/* ---------------- 2. Carga ---------------- */
let shown = 0;                       // lo que se ve (0-100)
function paint() {
  $("fill").style.width = shown + "%";
  $("pct").textContent = Math.floor(shown) + "%";
}

/* Tareas REALES: cuando todas acaban, real = 1 (pero se enseña 85 %). */
function makeTracker(tasks) {
  const t = {done: 0, total: tasks.length, ready: false};
  const results = tasks.map(fn => Promise.resolve().then(fn).catch(() => {}).then(() => { t.done++; }));
  t.all = Promise.all(results).then(() => { t.ready = true; });
  return t;
}
function preloadImage(url) {
  return new Promise(res => { const i = new Image(); i.onload = i.onerror = () => res(); i.src = url; setTimeout(res, 8000); });
}
function preloadVideo(url) {
  return new Promise(res => {
    const v = document.createElement("video");
    v.preload = "auto"; v.muted = true;
    v.oncanplaythrough = v.onerror = () => res();
    v.src = url; setTimeout(res, 8000);
  });
}
function buildTasks() {
  const tasks = [
    () => fetch("/api/status").then(r => r.json()),
    () => document.fonts ? document.fonts.ready : 0,
  ];
  if (TARGET) {                                      // calienta la pagina de destino y sus recursos
    tasks.push(() => fetch(TARGET).then(r => r.text()));
  }
  for (const m of cfg.media) tasks.push(() => m.type === "video" ? preloadVideo(m.url) : preloadImage(m.url));
  return tasks;
}

/* carrusel de imagenes / gifs / videos pequenos */
let slideTimer = 0, slideIdx = 0, slideEls = [], slideMs = 3000;
function buildCarousel() {
  const box = $("media");
  if (!cfg.media.length) return;
  box.classList.add("has");
  cfg.media.forEach(m => {
    const s = document.createElement("div"); s.className = "slide";
    let el;
    if (m.type === "video") { el = document.createElement("video"); el.muted = true; el.loop = true; el.playsInline = true; el.preload = "auto"; }
    else { el = document.createElement("img"); el.alt = ""; }
    el.src = m.url; s.appendChild(el); box.appendChild(s); slideEls.push(s);
  });
  slideMs = cfg.media_seconds * 1000;
  showSlide(0);
}
function showSlide(i) {
  slideEls.forEach((s, k) => {
    const on = k === i; s.classList.toggle("on", on);
    const v = s.querySelector("video");
    if (v) { if (on) v.play().catch(() => {}); else v.pause(); }
  });
  $("count").textContent = (i + 1) + " / " + slideEls.length;
  clearTimeout(slideTimer);
  slideTimer = setTimeout(() => { slideIdx = (slideIdx + 1) % slideEls.length; showSlide(slideIdx); }, slideMs);
}

/* progreso suave: el numero siempre sube y nunca salta atras */
function ease(from, to, dt, k) { return from + (to - from) * (1 - Math.exp(-dt * k)); }

async function loadingPhase() {
  const stage = $("stage");
  document.body.style.background = "#0b0d12";
  stage.classList.add("on");
  $("title").textContent = "Cargando";
  $("sub").textContent = TO === "desktop" ? "Volviendo al Escritorio" : "Entrando en modo " + NAMES[TO];
  buildCarousel();
  const tracker = makeTracker(buildTasks());
  const t0 = performance.now();
  let last = t0;
  /* Fase A: de 0 a 85 % siguiendo el progreso REAL (con un minimo de tiempo para que se vea) */
  await new Promise(done => {
    (function frame(now) {
      const dt = Math.min(0.1, (now - last) / 1000); last = now;
      const elapsed = (now - t0) / 1000;
      const real = tracker.ready ? 1 : (tracker.done / tracker.total) * 0.95;
      const timeCap = cfg.min_seconds > 0 ? Math.min(1, elapsed / cfg.min_seconds) : 1;
      const target = Math.min(real, timeCap) * 85;
      shown = Math.max(shown, ease(shown, target, dt, 5));
      if (tracker.ready && elapsed >= cfg.min_seconds && shown >= 84.5) { shown = 85; paint(); return done(); }
      paint(); requestAnimationFrame(frame);
    })(performance.now());
  });
  /* Todo esta realmente cargado (100 % real) pero se enseña 85 %. */
  if (cfg.fake) { await wait(450); await fastForward(); }
  shown = 100; paint();
}

/* Fase B: "x2 >>" efecto TV; la barra y el porcentaje van mas rapido hasta el 100 % */
let skipped = false;
function fastForward() {
  return new Promise(done => {
    const tv = $("tv"), skip = $("skip");
    tv.classList.add("on"); document.body.classList.add("fast");
    $("sub").textContent = "Casi listo…";
    if (cfg.skip_button) { skip.hidden = false; requestAnimationFrame(() => skip.classList.add("on")); }
    slideMs = cfg.media_seconds * 500;             // el carrusel tambien va a x2
    const finish = () => {
      tv.classList.remove("on"); document.body.classList.remove("fast"); skip.classList.remove("on"); done();
    };
    skip.onclick = () => { skipped = true; finish(); };
    const total = cfg.fake_seconds * 1000, t0 = performance.now();
    (function frame(now) {
      if (skipped) return;
      const p = Math.min(1, (now - t0) / total);
      shown = Math.max(shown, 85 + 15 * (p * p * (3 - 2 * p) * 0.35 + p * 0.65));   // arranca suave y acelera
      paint();
      if (p >= 1) return finish();
      requestAnimationFrame(frame);
    })(performance.now());
  });
}

/* ---------------- 3. Entrega ---------------- */
async function handoff() {
  $("title").textContent = "Listo";
  $("sub").textContent = "";
  await wait(350);
  $("stage").style.transition = "opacity .45s ease";
  $("stage").classList.remove("on");
  await wait(450);
  if (NAVIGATE) { await post("/api/loaded", {mode: TO}); location.replace(TARGET); }
  else await post("/api/loaded", {mode: TO});          // Iker: el vigilante abre su ventana; Escritorio: cierra esta
}

(async function main() {
  const getBoot = async q => { try { cfg = Object.assign(cfg, await (await fetch("/api/boot" + q)).json()); } catch (e) {} };
  await getBoot(IS_BOOT ? "?boot=1" : "");
  if (IS_BOOT && cfg.download) {                         // primer encendido: se baja el video del intro 4
    const skipped = await downloadScreen();
    await getBoot("?boot=1" + (skipped ? "&nodl=1" : ""));
  }
  await playIntro();
  await loadingPhase();
  await handoff();
})();
/* latido: si el navegador se cuelga o se queda en blanco, esto se para y el vigilante lo relanza */
setInterval(() => fetch("/api/alive").catch(() => {}), 5000); fetch("/api/alive").catch(() => {});
</script>
</body>
</html>
