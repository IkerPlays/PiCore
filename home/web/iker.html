<!doctype html>
<html lang="es">
<head>
<script src="/static/online.js"></script>
<script src="/static/fx.js" defer></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modo Iker · Notas</title>
<style>
  :root { --bg:#ece6da; --side:#e3dccd; --card:#fbf8f1; --fg:#23201b; --dim:#6b6458; --line:#d3cab7; --acc:#2a5fd8; --acc-fg:#fff; --bad:#b73a30; --ok:#1c7340; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161b; --side:#0f1115; --card:#1a1d24; --fg:#f2f4f8; --dim:#8b93a3; --line:#2a2f39; --acc:#7aa7ff; --acc-fg:#07101f; } }
  * { box-sizing:border-box; margin:0; }
  .ic { width:1.15em; height:1.15em; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; vertical-align:-.2em; }
  html,body { height:100%; background:var(--bg); color:var(--fg); font-family:system-ui,"Segoe UI",sans-serif; }
  body { display:grid; grid-template-columns:270px 1fr; grid-template-rows:56px auto 1fr; }
  header { grid-column:1 / span 2; display:flex; align-items:center; gap:8px; padding:0 12px; background:var(--side); border-bottom:1px solid var(--line); }
  header .title { font-weight:700; font-size:18px; margin-right:auto; }
  @media (max-width:1180px) {            /* la barra no cabia en 1024 px y «Salir» quedaba fuera: los botones secundarios pasan a solo icono (el texto sigue para lectores de pantalla) */
    #usb, #dup, #pin, #pdf, #web { font-size:0 !important; gap:0 !important; padding:0 13px !important; }
    #usb .ic, #dup .ic, #pin .ic, #pdf .ic, #web .ic { width:19px !important; height:19px !important; }
  }
  @media (max-width:900px) { #new, #del { font-size:0 !important; gap:0 !important; padding:0 13px !important; } #new .ic, #del .ic { width:19px !important; height:19px !important; } header { gap:6px; } }
  button { font:inherit; font-size:16px; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:12px; padding:9px 14px; cursor:pointer; }
  button:hover { border-color:var(--acc); }
  button:active, button.primary { background:var(--acc); color:var(--acc-fg); border-color:var(--acc); }
  button.danger.armed { background:var(--bad); color:#fff; border-color:var(--bad); }
  aside { background:var(--side); border-right:1px solid var(--line); overflow:auto; padding:10px; }
  aside .item { padding:11px 12px; border-radius:12px; cursor:pointer; margin-bottom:4px; }
  aside .item.sel { background:var(--card); box-shadow:0 0 0 1px var(--acc) inset; }
  aside .item b { display:block; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  aside .item span { font-size:13px; color:var(--dim); }
  #q { width:100%; font:inherit; font-size:16px; padding:10px 12px; margin-bottom:10px; border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--fg); outline:0; }
  #q:focus { border-color:var(--acc); }
  aside .item .snip { display:block; font-size:13px; color:var(--dim); margin-top:3px; white-space:normal; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  mark { background:#ffd54a66; color:inherit; border-radius:3px; }
  aside .empty { color:var(--dim); padding:16px 8px; font-size:15px; line-height:1.4; }
  #tags { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  #tags button { font-size:14px; padding:5px 10px; border-radius:999px; }
  .ncount { font-size:12px; color:var(--dim); padding:2px 6px 6px; }
  #pin.on { background:var(--acc); color:var(--acc-fg); border-color:var(--acc); }
  #tags button.on { background:var(--acc); color:var(--acc-fg); border-color:var(--acc); }
  #marks { grid-column:1 / span 2; display:flex; gap:8px; align-items:center; padding:6px 12px; background:var(--side); border-bottom:1px solid var(--line); overflow-x:auto; }
  #marks > span { color:var(--dim); font-size:14px; }
  #marks .mk { display:inline-flex; align-items:center; white-space:nowrap; border:1px solid var(--line); border-radius:999px; background:var(--card); }
  #marks .mk a { color:var(--fg); text-decoration:none; padding:6px 6px 6px 14px; font-size:15px; }
  #marks .mk button { border:0; background:none; padding:6px 10px 6px 4px; color:var(--dim); font-size:14px; }
  #mform { display:none; gap:6px; } #mform.on { display:flex; }
  #mform input { font:inherit; font-size:15px; padding:6px 10px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--fg); width:170px; }
  main { display:flex; flex-direction:column; min-height:0; }
  textarea { flex:1; width:100%; border:0; outline:0; resize:none; padding:22px 28px; font:20px/1.55 Georgia,"Times New Roman",serif; background:var(--card); color:var(--fg); }
  footer { display:flex; gap:16px; padding:6px 16px; font-size:13px; color:var(--dim); background:var(--side); border-top:1px solid var(--line); }
  #status.ok { color:var(--ok); } #status.err { color:var(--bad); }
</style>
<link rel="stylesheet" href="/static/ui.css">
<style>   /* mismo tema que Casa (claro de dia, oscuro de noche, o el que elegiste); ui.css fija los colores base y aqui se le suma el del panel lateral */
  html:not([data-theme=light]) { --side:#0b0e14; } html[data-theme=light] { --side:#ebe5d8; }
</style>
<script>(function () { var t = null; try { t = localStorage.getItem("pcpi-theme"); } catch (e) {} var h = new Date().getHours(); document.documentElement.dataset.theme = t === "light" || t === "dark" ? t : (h >= 8 && h < 20 ? "light" : "dark"); })();</script>
</head>
<body>
<!--ICONS-->
<header>
  <span class="title">Modo Iker</span>
  <button id="new"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg> Nueva</button>
  <button id="save" class="primary"><svg class="ic" aria-hidden="true"><use href="#i-check"/></svg> Guardar</button>
  <button id="del" class="danger"><svg class="ic" aria-hidden="true"><use href="#i-trash"/></svg> Borrar</button>
  <button id="usb" title="Copiar todas las notas a un USB como archivos .txt"><svg class="ic" aria-hidden="true"><use href="#i-usb"/></svg> USB</button>
  <button id="dup" title="Crear una copia de esta nota"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg> Duplicar</button>
  <button id="pin" title="Fijar esta nota arriba de la lista" aria-pressed="false"><svg class="ic" aria-hidden="true"><use href="#i-star"/></svg> Fijar</button>
  <button id="pdf" title="Abrir esta nota como PDF para imprimirla o guardarla"><svg class="ic" aria-hidden="true"><use href="#i-pdf"/></svg> PDF</button>
  <button id="web"><svg class="ic" aria-hidden="true"><use href="#i-globe"/></svg> Internet</button>
  <button id="exit"><svg class="ic" aria-hidden="true"><use href="#i-home"/></svg> Salir</button>
</header>
<div id="marks"><span>Marcadores</span><span id="mlist"></span>
  <button id="madd" title="Añadir un acceso directo a una web"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg> Añadir</button>
  <span id="mform"><input id="mt" placeholder="Nombre" maxlength="40" autocomplete="off"><input id="mu" placeholder="direccion.com" autocomplete="off"><button id="msave" class="primary">Guardar</button></span>
</div>
<aside><input id="q" type="search" placeholder="Buscar en las notas…" autocomplete="off"><div id="tags"></div><div id="ncount" class="ncount" aria-live="polite"></div><div id="list"></div></aside>
<main>
  <textarea id="text" placeholder="Escribe aquí…  (se guarda solo)" spellcheck="true" autofocus></textarea>
  <footer><span id="status">Lista</span><span id="count"></span><span style="margin-left:auto">Ctrl+S guardar · Ctrl+N nueva · Ctrl+D duplicar · Internet se abre en una pestaña nueva</span></footer>
</main>
<script>
const $ = id => document.getElementById(id);
const ico = (n, cls) => '<svg class="ic' + (cls ? " " + cls : "") + '" aria-hidden="true"><use href="#i-' + n + '"/></svg>';
const api = (url, body) => fetch(url, body === undefined ? {} : {method:"POST", headers:{"X-PCPI":"1"}, body:JSON.stringify(body)}).then(r => r.json());
let cur = null, dirty = false, timer = 0, armed = 0;

function when(t) {
  const d = new Date(t * 1000), now = new Date();
  return d.toDateString() === now.toDateString()
    ? d.toLocaleTimeString("es-ES", {hour:"2-digit", minute:"2-digit"})
    : d.toLocaleDateString("es-ES", {day:"numeric", month:"short"});
}
function setStatus(msg, cls) { $("status").textContent = msg; $("status").className = cls || ""; }
function counts() {
  const t = $("text").value, w = t.trim() ? t.trim().split(/\s+/).length : 0;
  const min = Math.round(w / 200);                       // unas 200 palabras por minuto de lectura
  $("count").textContent = w + (w === 1 ? " palabra · " : " palabras · ") + t.length + (t.length === 1 ? " carácter" : " caracteres") + (min >= 1 ? " · " + min + " min de lectura" : "");
}

/* resalta las palabras buscadas SIN usar innerHTML (el texto de las notas nunca se interpreta como HTML) */
function highlight(el, text, words) {
  if (!words.length) { el.textContent = text; return; }
  /* se busca sobre una version sin tildes ni mayusculas con la MISMA longitud que el original (letra a letra) */
  const units = text.split(""), folded = units.map(u => (u.normalize("NFD")[0] || u).toLowerCase()).join("");
  const on = new Array(units.length).fill(false);
  for (const w of words) {
    const fw = w.split("").map(u => (u.normalize("NFD")[0] || u).toLowerCase()).join("");
    if (!fw) continue;
    for (let i = folded.indexOf(fw); i >= 0; i = folded.indexOf(fw, i + fw.length)) for (let k = i; k < i + fw.length; k++) on[k] = true;
  }
  let i = 0;
  while (i < units.length) {
    let j = i; while (j < units.length && on[j] === on[i]) j++;
    const part = units.slice(i, j).join("");
    if (on[i]) { const m = document.createElement("mark"); m.textContent = part; el.append(m); } else el.append(document.createTextNode(part));
    i = j;
  }
}
let query = "", searchTimer = 0;
$("q").addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => { query = $("q").value.trim(); refresh(); }, 200); });

async function refresh() {
  let notes = await api("/api/notes" + (query ? "?q=" + encodeURIComponent(query) : ""));
  paintTags();
  if (tagSel) notes = notes.filter(n => (n.tags || []).includes(tagSel));
  $("ncount").textContent = notes.length ? notes.length + (notes.length === 1 ? " nota" : " notas") + (query || tagSel ? (notes.length === 1 ? " encontrada" : " encontradas") : "") : "";
  const l = $("list"); l.innerHTML = "";
  const words = query.split(/\s+/).filter(Boolean);
  if (!notes.length) l.innerHTML = query ? "" : '<div class="empty">Aún no hay notas.<br>Pulsa «Nueva» y empieza a escribir.</div>';
  if (!notes.length && query) { l.textContent = ""; const e = document.createElement("div"); e.className = "empty"; e.textContent = "No hay notas con «" + query + "»."; l.append(e); }
  for (const n of notes) {
    const d = document.createElement("div");
    d.className = "item" + (n.id === cur ? " sel" : "");
    const b = document.createElement("b"); if (n.pinned) b.insertAdjacentHTML("afterbegin", ico("star") + " "); highlight(b, n.title, words);
    const s = document.createElement("span"); s.textContent = when(n.updated);
    d.append(b, s);
    if (n.snippet) { const sn = document.createElement("span"); sn.className = "snip"; highlight(sn, n.snippet, words); d.append(sn); }
    d.onclick = () => openNote(n.id);
    l.append(d);
  }
}

/* etiquetas: cualquier palabra con # en el texto (#compra) es una etiqueta; tocarla filtra la lista */
let tagSel = "";
async function paintTags() {
  let tags = [];
  try { tags = await api("/api/notes/tags"); } catch (e) {}
  if (tagSel && !tags.some(t => t.tag === tagSel)) tagSel = "";
  const box = $("tags"); box.textContent = "";
  for (const t of tags) {
    const b = document.createElement("button"); b.textContent = "#" + t.tag + " " + t.count; if (t.tag === tagSel) b.className = "on";
    b.onclick = () => { tagSel = tagSel === t.tag ? "" : t.tag; refresh(); };
    box.append(b);
  }
}

/* marcadores: accesos directos a webs, se abren en una pestaña nueva */
async function paintMarks() {
  let items = [];
  try { items = await api("/api/bookmarks"); } catch (e) {}
  const box = $("mlist"); box.textContent = "";
  for (const m of items) {
    const w = document.createElement("span"); w.className = "mk";
    const a = document.createElement("a"); a.textContent = m.title; a.href = m.url; a.target = "_blank"; a.rel = "noopener noreferrer";
    const x = document.createElement("button"); x.innerHTML = ico("x"); x.title = "Quitar"; x.setAttribute("aria-label", "Quitar " + m.title);
    x.onclick = async () => { await api("/api/bookmarks", {action:"delete", id:m.id}); paintMarks(); };
    w.append(a, x); box.append(w, " ");
  }
}
$("madd").onclick = () => { $("mform").classList.toggle("on"); if ($("mform").classList.contains("on")) $("mu").focus(); };
$("msave").onclick = async () => {
  const r = await fetch("/api/bookmarks", {method:"POST", headers:{"X-PCPI":"1"}, body:JSON.stringify({action:"add", title:$("mt").value, url:$("mu").value})});
  if (r.ok) { $("mt").value = ""; $("mu").value = ""; $("mform").classList.remove("on"); paintMarks(); setStatus("Marcador guardado", "ok"); }
  else setStatus((await r.json()).error === "peticion invalida" ? "Esa dirección no vale (usa http o https)" : "No se pudo guardar", "err");
};
$("mu").addEventListener("keydown", e => { if (e.key === "Enter") $("msave").click(); });
$("pdf").onclick = async () => { await save(); if (cur) window.open("/api/notes/" + cur + ".pdf", "_blank"); else setStatus("Guarda la nota primero", "err"); };

async function save() {
  clearTimeout(timer);
  if (!dirty) return;
  const text = $("text").value;
  if (!text.trim() && !cur) { dirty = false; return; }       // no guardes notas vacias nuevas
  try {
    const r = await api("/api/notes", {id: cur, text, pinned});
    cur = r.id; dirty = false;
    setStatus("Guardado", "ok");
    refresh();
  } catch (e) { setStatus("No se pudo guardar", "err"); }
}

async function openNote(id) {
  await save();
  if (id) {
    const n = await api("/api/notes/" + id);
    $("text").value = n.text; cur = id; setPin(n.pinned === true);
  } else { $("text").value = ""; cur = null; setPin(false); }
  dirty = false; setStatus(id ? "Nota abierta" : "Nota nueva"); counts(); refresh(); $("text").focus();
}

$("text").addEventListener("input", () => {
  dirty = true; setStatus("Escribiendo…"); counts();
  clearTimeout(timer); timer = setTimeout(save, 1200);
});
let pinned = false;
function setPin(v) { pinned = v; $("pin").setAttribute("aria-pressed", v ? "true" : "false"); $("pin").classList.toggle("on", v); }
$("pin").onclick = () => { setPin(!pinned); dirty = true; if (cur) save(); else setStatus("Se fijará al guardar"); };
$("dup").onclick = async () => {
  const text = $("text").value;
  if (!text.trim()) { setStatus("No hay nada que duplicar", "err"); return; }
  await save();
  try { const r = await api("/api/notes", {id: null, text}); await openNote(r.id); setStatus("Copia creada", "ok"); } catch (e) { setStatus("No se pudo duplicar", "err"); }
};
$("new").onclick = () => openNote(null);
$("save").onclick = save;
$("del").onclick = async () => {
  const b = $("del");
  if (!cur) { $("text").value = ""; dirty = false; counts(); return; }
  if (!b.classList.contains("armed")) {                         // doble toque para confirmar
    b.classList.add("armed"); b.innerHTML = ico("trash") + " ¿Seguro?";
    armed = setTimeout(() => { b.classList.remove("armed"); b.innerHTML = ico("trash") + " Borrar"; }, 3000); return;
  }
  clearTimeout(armed); b.classList.remove("armed"); b.innerHTML = ico("trash") + " Borrar";
  await api("/api/notes/delete", {id: cur});
  cur = null; $("text").value = ""; dirty = false; counts(); setStatus("Nota borrada"); refresh();
};
$("usb").onclick = async () => {
  await save();
  setStatus("Copiando al USB…");
  try {
    const r = await fetch("/api/notes/export", {method:"POST", headers:{"X-PCPI":"1"}, body:"{}"});
    const d = await r.json();
    if (r.ok) setStatus(d.count + " notas copiadas a " + d.path, "ok"); else setStatus(d.error || "No se pudo exportar", "err");
  } catch (e) { setStatus("No se pudo exportar", "err"); }
};
$("web").onclick = () => window.open("https://www.google.com/", "_blank");
$("exit").onclick = async () => { await save(); api("/api/mode", {mode:"home"}); };
document.addEventListener("keydown", e => {
  if (e.ctrlKey && e.key === "s") { e.preventDefault(); save(); }
  if (e.ctrlKey && e.key === "n") { e.preventDefault(); openNote(null); }
  if (e.ctrlKey && e.key === "p") { e.preventDefault(); $("pin").click(); }
  if (e.ctrlKey && e.key === "d") { e.preventDefault(); $("dup").click(); }                          // Ctrl+D duplica la nota
  if (e.ctrlKey && e.key === "f") { e.preventDefault(); $("q").focus(); $("q").select(); }           // Ctrl+F salta al buscador de notas
});
window.addEventListener("beforeunload", () => { if (dirty) save(); });
refresh(); counts(); paintMarks();
/* latido: si el navegador se cuelga o se queda en blanco, esto se para y el vigilante lo relanza */
setInterval(() => fetch("/api/alive").catch(() => {}), 5000); fetch("/api/alive").catch(() => {});
</script>
</body>
</html>
