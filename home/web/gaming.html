<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCPi · Gaming</title>
<style>
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; background:#0f1115; color:#f2f4f8; font-family:system-ui,sans-serif; overflow:hidden; }
  main { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; }
  h1 { font-size:clamp(48px,10vw,110px); letter-spacing:-.03em; }
  p { font-size:24px; color:#8b93a3; }
  button { font:inherit; font-size:22px; padding:16px 32px; border:0; border-radius:16px; background:#1a1d24; color:#f2f4f8; }
  button:active { background:#60a5fa; color:#000; }
</style>
</head>
<body>
<main>
  <div style="font-size:72px">🎮</div>
  <h1>Próximamente</h1>
  <p>El modo Gaming está en camino.</p>
  <button id="back">← Volver al modo Casa</button>
</main>
<script>
document.getElementById("back").onclick = () =>
  fetch("/api/mode", {method:"POST", headers:{"X-PCPI":"1"}, body:JSON.stringify({mode:"home"})});
</script>
</body>
</html>
