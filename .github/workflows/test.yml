name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg shellcheck
      - run: make lint
      - run: shellcheck -S warning install.sh uninstall.sh bin/*
      - run: pip install onnxruntime numpy scipy scikit-learn tqdm pillow "openwakeword==0.4.0"
      - run: make test
